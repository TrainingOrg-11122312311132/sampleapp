name: CAlling reusable

on:
  workflow_dispatch:

jobs:
  build-job:
    runs-on: ubuntu-latest

    steps:

      - name: checkout code
        uses: actions/checkout@v4.1.7

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4.0.1
        with:
          dotnet-version: '10.x'

      - name: Build code
        run: dotnet build --configuration Release

      - name: Publish code
        run: dotnet publish -c Release --property:PublishDir="${{env.DOTNET_ROOT}}/myapp"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4.3.6
        with:
          # Artifact name
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  call-reusable-depooyment-workflow-job:
    needs: build-job
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      package-name: .net-app
      app-name: appsvc1
      deployment-slot: development
    secrets: 
      acure-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
    
